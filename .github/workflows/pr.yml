name: PR checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: linux-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # this allegedly clears up 20-30GB of space
        # This is required because the java artifacts downloaded later can be _very_ large.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'jetbrains'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Install Xvfb and Mesa software renderer
        # There's no GPU/display on this runner. ShaderProgramCompilerTest needs a real GL
        # context (created headlessly via GLFW), which needs both a display server (Xvfb) and a
        # software GL driver (Mesa's llvmpipe, forced on via LIBGL_ALWAYS_SOFTWARE below).
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils

      - name: Run tests
        run: xvfb-run --auto-servernum ./gradlew test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
